<header>
  <h1>LEVEL UP</h1>
  <p>Sua jornada de evolução</p>
</header>

@if (gameState.achievementNotifications().length > 0) {
  @let achievement = gameState.achievementNotifications()[0];

  <div class="achievement-notification">
    <span>{{ achievement.icon }}</span>

    <div>
      <strong>Conquista desbloqueada!</strong>
      <p>{{ achievement.title }}</p>
      <small>{{ achievement.description }}</small>
    </div>

    <button (click)="gameState.dismissAchievementNotification()">×</button>
  </div>
}

<main>
  <div class="left-column">
    <app-player-status></app-player-status>
    <app-achievement-list></app-achievement-list>
    <app-inventory></app-inventory>
  </div>

  <div class="right-column">
    <app-skill-list></app-skill-list>
    <app-mission-list></app-mission-list>
  </div>
</main>
